# Local-only Budget v2 development database.
#
# Credentials come from docs/budget-v2/.env.localdb (gitignored) rather than
# being written here. They are throwaway values for a container bound to
# loopback, but a committed default password is exactly the habit that ends with
# a real one committed — and secret scanners are right to block it.
# Gives us a Neon-protocol-compatible endpoint over a plain Postgres, so the app's
# existing `neon()` / drizzle-orm/neon-http driver works UNCHANGED (important:
# neon-http has no interactive transactions, and Budget v2 is designed around
# db.batch() — swapping to node-postgres locally would hide that difference).
services:
  postgres:
    image: postgres:16-alpine
    container_name: ps-budget-pg
    environment:
      POSTGRES_USER: ${LOCAL_DB_USER:?set LOCAL_DB_USER in docs/budget-v2/.env.localdb}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?set LOCAL_DB_PASSWORD in docs/budget-v2/.env.localdb}
      POSTGRES_DB: ${LOCAL_DB_NAME:-main}
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  neon-proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    container_name: ps-budget-neonproxy
    environment:
      PG_CONNECTION_STRING: postgres://${LOCAL_DB_USER}:${LOCAL_DB_PASSWORD}@postgres:5432/${LOCAL_DB_NAME:-main}
    # 4445 is the proxy's serverless listener: HTTPS SQL-over-HTTP + wss.
    ports:
      - "4444:4445"
    depends_on:
      postgres:
        condition: service_healthy


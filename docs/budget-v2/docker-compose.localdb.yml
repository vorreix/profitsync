# Local-only Budget v2 development database.
# Gives us a Neon-protocol-compatible endpoint over a plain Postgres, so the app's
# existing `neon()` / drizzle-orm/neon-http driver works UNCHANGED (important:
# neon-http has no interactive transactions, and Budget v2 is designed around
# db.batch() — swapping to node-postgres locally would hide that difference).
services:
  postgres:
    image: postgres:16-alpine
    container_name: ps-budget-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: main
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d main"]
      interval: 3s
      timeout: 3s
      retries: 20

  neon-proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    container_name: ps-budget-neonproxy
    environment:
      PG_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/main
    # 4445 is the proxy's serverless listener: HTTPS SQL-over-HTTP + wss.
    ports:
      - "4444:4445"
    depends_on:
      postgres:
        condition: service_healthy

